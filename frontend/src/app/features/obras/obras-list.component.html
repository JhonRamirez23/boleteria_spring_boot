<div class="obras-container">
  <div class="page-header">
    <div class="header-title">
      <mat-icon>movie</mat-icon>
      <h1>Obras</h1>
    </div>
    <button mat-flat-button
      color="primary"
      routerLink="/obras/nueva"
      *ngIf="isAdmin"
    >
      <mat-icon>add</mat-icon>
      Nueva Obra
    </button>
  </div>

  <mat-card class="table-card">
    <div class="search-bar" *ngIf="!isAdmin">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar por título</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput
          [(ngModel)]="busqueda"
          (keyup.enter)="onBuscar()"
          placeholder="Ej: Romeo y Julieta"
        />
        <button mat-icon-button matSuffix (click)="onBuscar()">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <div class="loading-container" *ngIf="loading">
      <mat-spinner diameter="48"></mat-spinner>
    </div>

    <div *ngIf="!loading">
      <table mat-table [dataSource]="dataSource" class="obras-table">
        <ng-container matColumnDef="titulo">
          <th mat-header-cell *matHeaderCellDef>Título</th>
          <td mat-cell *matCellDef="let obra">
            <div class="titulo-cell">
              <span class="titulo">{{ obra.titulo }}</span>
              <span class="descripcion">{{ obra.descripcion }}</span>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="genero">
          <th mat-header-cell *matHeaderCellDef>Género</th>
          <td mat-cell *matCellDef="let obra">
            <mat-chip-set>
              <mat-chip>{{ obra.genero || "Sin género" }}</mat-chip>
            </mat-chip-set>
          </td>
        </ng-container>

        <ng-container matColumnDef="duracionMinutos">
          <th mat-header-cell *matHeaderCellDef>Duración</th>
          <td mat-cell *matCellDef="let obra">
            {{ obra.duracionMinutos }} min
          </td>
        </ng-container>

        <ng-container matColumnDef="activa">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let obra">
            <mat-chip [class]="obra.activa ? 'chip-activa' : 'chip-inactiva'">
              {{ obra.activa ? "Activa" : "Inactiva" }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let obra">
            <div class="acciones" *ngIf="isAdmin">
              <button
                mat-icon-button
                color="primary"
                [routerLink]="['/obras/editar', obra.id]"
                matTooltip="Editar"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="eliminar(obra)"
                matTooltip="Eliminar"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
            No se encontraron obras
          </td>
        </tr>
      </table>

      <mat-paginator
        [length]="totalElements"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 25]"
        (page)="onPageChange($event)"
        showFirstLastButtons
      >
      </mat-paginator>
    </div>
  </mat-card>
</div>
